name: Helm charts

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Lint charts
        run: |
          helm lint charts/bng
          helm lint charts/frr-isp
          helm lint charts/cpe-lab
      - name: Render charts
        run: |
          helm template osvbng charts/bng --namespace osvbng-ha > /dev/null
          helm template osvbng-frr-isp charts/frr-isp --namespace osvbng-ha > /dev/null
          helm template osvbng-cpe-lab charts/cpe-lab --namespace osvbng-ha --set genieacs.enabled=false > /dev/null
