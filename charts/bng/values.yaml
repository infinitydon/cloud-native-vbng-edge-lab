osvbng:
  image: "ghcr.io/infinitydon/osvbng:main-753e934@sha256:d3d2f3e815184b86367bf2d3cb2e749b11d0d7025b88623886910af82e9da108"
  pullPolicy: IfNotPresent
  imagePullSecrets: []
  privileged: true
  serviceType: ClusterIP
  ports:
    grpc: 50050
    ha: 50051
    prometheus: 9090
    http: 8080
  mountSysKernelDebug: true
  shmSize: "2Gi"
  resources:
    cpu: "6"
    memory: "6Gi"
    hugepages1Gi: "2Gi"
  nodeAffinity:
    matchLabels:
      osvbng.infinitydon.com/bng-frr-ha: "true"
  core:
    installDefaultRoute: false
  bgp:
    enabled: true
    # Advertise the private subscriber pool only for explicitly routed,
    # non-CGNAT services. CGNAT Internet access needs only cgnatPrefix.
    advertiseSubscriberPrefix: false
    localAs: 65010
    peerAs: 65020
    neighbors:
      - name: frr-a
        address: 172.31.255.4
      - name: frr-b
        address: 172.31.255.5
    cgnatPrefix: "100.64.100.0/24"
    bfd: false
    pollIntervalSeconds: 2
  cgnat:
    enabled: true
    policy: residential
    outsideInterface: core
    proxyArp: false
    insideNetwork: 10.255.0.0/24
    outsideAddresses:
      - 100.64.100.0/24
    blockSize: 512
    maxBlocksPerSubscriber: 2
    maxSessionsPerSubscriber: 2000
  ha:
    listenAddress: "0.0.0.0:50051"
    # Addresses are explicit and tied to StatefulSet identity.
    members:
      - nodeId: bng-a
        coreAddress: 172.31.255.2/29
        priority: 100
        preempt: false
      - nodeId: bng-b
        coreAddress: 172.31.255.3/29
        priority: 90
        preempt: true
    heartbeat:
      interval: 1s
      timeout: 5s
    sync:
      backlogSize: 10000
      pageSize: 1000
      bulkSyncTimeout: 60s
    srg:
      name: default
      virtualMac: "02:00:5e:00:01:01"
      subscriberGroups:
        - default
      interfaces:
        - access
      trackPriorityDecrement: 60
      networks:
        - prefix: 100.64.100.0/24
  dpdk:
    enabled: true
    # Allocated by the separately installed SR-IOV Network Device Plugin.
    resourceName: qemu-virtio-dpdk.dev/osvbng_vfio
    rxQueues: 2
    txQueues: 2
    socketMemory: "1024"

# Optional subscriber AAA profile. When disabled, osvbng uses its local
# allow-all provider and no FreeRADIUS or PostgreSQL resources are rendered.
radius:
  enabled: false
  # Lab-only deterministic MAC identities used by the separate cpe-lab chart.
  autoProvisionSubscriberUsers: true
  subscriberCapacity: 20
  existingSecret: ""
  sharedSecretKey: shared-secret
  clientNetwork: 10.1.0.0/16
  image: "freeradius/freeradius-server:3.2.7@sha256:42b05de4405b1e745686b9ed0f70307fd43e998b850b3e6bd936733a8c260595"
  pullPolicy: IfNotPresent
  authPort: 1812
  accountingPort: 1813
  interimInterval: 60
  ipoePassword: secret
  bootstrapUsers: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  postgresql:
    image: "postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394"
    pullPolicy: IfNotPresent
    passwordKey: postgres-password
    database: radius
    username: radius
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
